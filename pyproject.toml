[project]
name = "autokol"
version = "2.17.0"
description = "Utopai Cold Email Engine - AI-powered personalized cold outreach"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
dependencies = [
    "streamlit>=1.30.0",
    "streamlit-quill>=0.0.2",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "openai>=1.0.0",
    "requests>=2.31.0",
    "pytz>=2023.3",
    "sentry-sdk>=1.39.0",
    "pyyaml>=6.0",
    "sendgrid>=6.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
